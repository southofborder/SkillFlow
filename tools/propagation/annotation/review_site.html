<div class="app">
 <header class="top"><div><div class="brand">Skill-IR <span style="font-weight:400;opacity:.65">/</span> 语义与安全标注审查</div><div class="subtitle">逐例查看当前 CFG、核对证据与动作安全语义</div></div><div class="run" id="run-info"></div></header>
 <div class="layout">

<script>
"use strict";
const DATA=JSON.parse(document.getElementById("review-data").textContent);
const $=id=>document.getElementById(id);
const state={current:null,ir:null,block:null,tab:"operation",sourceFile:null,sourceRange:null,showAll:false,scale:1,x:0,y:0,width:0,height:0};
const effectLabels={llm:"大语言模型",agent_runtime:"代理运行时",tool:"工具",human:"人工",source:"数据引入",sink:"数据到达边界",transformer:"数据变换",context_read:"读取上下文",context_write:"上下文写入",fs_read:"读取文件",fs_write:"写入文件",net_send:"网络发送",net_receive:"网络接收",model_observe:"模型观察",user_output:"用户输出",transform:"变换"};
const labels={audit_passed:"核对器通过",semantic_failure:"无法完成必要判断",revision_limit:"修复次数耗尽",audit_error:"核对执行错误",extraction_error:"提取执行错误",fidelity_error:"保真检查错误",execution_error:"执行错误",invalid_response:"响应无效",input_error:"输入错误",interrupted:"已中断",not_run:"未执行",running:"运行中",revise:"仍有明确差异",complete:"标注记录完整",represented:"保留（模型判定）",omitted:"遗漏",mistranslated:"错转",unsupported_addition:"无依据新增",internal_conflict:"内部冲突"};
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined&&text!==null)n.textContent=String(text);return n}
function add(parent,...children){children.filter(Boolean).forEach(child=>parent.append(child));return parent}
function statusClass(status){if(["audit_passed","complete","represented"].includes(status))return"pass";if(["revise","revision_limit"].includes(status))return"warn";if(status&&status.includes("error")||["semantic_failure","invalid_response","interrupted","omitted","mistranslated","unsupported_addition","internal_conflict"].includes(status))return"error";return"info"}
function badge(status,prefix=""){return node("span","badge "+statusClass(status),prefix+(labels[status]||status||"未记录"))}
function originBadge(c){const origin=c.execution_origin;return origin?node("span","badge info",origin.kind==="rerun"?"本次重新执行":"复用父记录"):null}
function originSummary(c){const origin=c.execution_origin;return origin?(origin.kind==="rerun"?"执行来源：本次重新执行":"执行来源：复用父运行记录，本次未重新调用模型")+` · 父运行 ${origin.parent_run_id} · 实际执行运行 ${origin.source_run_id}`:""}
function jsonBlock(value){return node("pre","json",JSON.stringify(value,null,2))}
function feedbackCategory(status){if(status==="audit_passed")return"pass";if(status==="semantic_failure")return"semantic_failure";if(status&&status.includes("error")||["revision_limit","invalid_response","interrupted"].includes(status))return"error";return"other"}
function notice(text,kind=""){return node("div","notice "+kind,text)}
function runReason(c,phase,label){
 const full=String(c[phase+"_reason"]||"");const supplied=c[phase+"_reason_summary"];
 const wrap=node("div","run-diagnostic");if(!full&&!supplied)return wrap;
 const candidate=typeof supplied==="string"&&supplied.trim()?supplied:full;
 const folded=full.length>600||candidate!==full;
 const summary=folded?(candidate.split(/\r?\n/,1)[0].slice(0,420)+(candidate.split(/\r?\n/,1)[0].length>420?"…":"")):candidate;
 wrap.append(notice(label+"："+summary+(folded?"（完整诊断见下方）":""),statusClass(c[phase+"_status"])));
 if(folded){const details=node("details","raw-details");details.append(node("summary","",`展开完整执行诊断（${full.length} 字符）`),node("pre","json",full));wrap.append(details)}
 return wrap
}
function button(text,handler,cls=""){const b=node("button",cls,text);b.type="button";b.addEventListener("click",handler);return b}
function operationEntries(c){return Object.entries(c.cfg?.blocks||{}).flatMap(([id,b])=>(b.instructions||[]).map(ir=>({block_id:id,block:b,ir})))}
function renderList(){const q=$("search").value.trim().toLowerCase(),f=$("feedback-filter").value,a=$("annotation-filter").value;const cases=DATA.cases.filter(c=>(!q||[c.case_id,c.sample_id,c.skill_name,c.basename].join(" ").toLowerCase().includes(q))&&(f==="all"||feedbackCategory(c.feedback_status)===f)&&(a==="all"||(a==="failed"?!["complete"].includes(c.annotation_status):c.annotation_status===a)));$("case-count").textContent=`显示 ${cases.length} / ${DATA.cases.length} 例`;$ ("case-list").replaceChildren();for(const c of cases){const b=button("",()=>selectCase(c.case_id),"case"+(state.current?.case_id===c.case_id?" active":""));b.setAttribute("aria-label",`${c.case_id} ${c.skill_name||c.basename}`);add(b,add(node("div","case-title"),node("span","case-id",c.case_id),node("span","",c.skill_name||c.basename)),node("div","case-small",`${c.sample_id||""} · 第 ${c.selected_revision??"—"} 轮`),add(node("div","badges"),badge(c.feedback_status),badge(c.annotation_status),originBadge(c)));$("case-list").append(b)}if(!cases.length)$("case-list").append(node("div","empty","没有符合筛选条件的样例。"))}
function selectCase(id){state.current=DATA.cases.find(c=>c.case_id===id);state.ir=null;state.block=null;state.sourceFile=null;state.sourceRange=null;state.showAll=false;renderList();const c=state.current;const heading=node("h1","",`${c.case_id} · ${c.skill_name||c.basename}`);const bs=add(node("div","badges"),badge(c.feedback_status,"核对："),badge(c.annotation_status,"标注："),originBadge(c));const meta=node("div","metadata",`${c.sample_id||"未记录样例 ID"} · 选定轮次 ${c.selected_revision??"无有效图"} · ${operationEntries(c).length} 条 IR · ${Object.keys(c.profiles||{}).length} 条 profile`);$("case-header").replaceChildren(heading,bs,meta);if(c.execution_origin)$("case-header").append(node("div","metadata",originSummary(c)));if(c.png_file){const link=node("a","linkbutton","打开独立 PNG");link.href="../"+c.png_file;link.target="_blank";link.rel="noopener";meta.append(" · ",link)}loadGraph(c);renderPanel()}
function loadGraph(c){$("graph-stage").replaceChildren();$("graph-empty").hidden=true;state.width=state.height=0;if(!c.svg){$("graph-empty").hidden=false;$("graph-empty").replaceChildren(node("strong","","此例没有可展示的有效 CFG"),runReason(c,"feedback","执行记录"));$("zoom-value").textContent="—";return}const doc=new DOMParser().parseFromString(c.svg,"image/svg+xml");const svg=document.importNode(doc.documentElement,true);const view=svg.viewBox.baseVal;state.width=view.width||parseFloat(svg.getAttribute("width"))||1200;state.height=view.height||parseFloat(svg.getAttribute("height"))||800;svg.setAttribute("width",String(state.width));svg.setAttribute("height",String(state.height));$("graph-stage").append(svg);requestAnimationFrame(fit)}
function transform(){$("graph-stage").style.transform=`translate(${state.x}px,${state.y}px) scale(${state.scale})`;$("zoom-value").textContent=`${Math.round(state.scale*1000)/10}%`}
function fit(){if(!state.width)return;const rect=$("viewport").getBoundingClientRect();state.scale=Math.min((rect.width-32)/state.width,(rect.height-32)/state.height,1);state.x=(rect.width-state.width*state.scale)/2;state.y=(rect.height-state.height*state.scale)/2;transform()}
function zoom(factor,cx,cy){if(!state.width)return;const rect=$("viewport").getBoundingClientRect();cx??=rect.width/2;cy??=rect.height/2;const next=Math.max(.005,Math.min(4,state.scale*factor)),ratio=next/state.scale;state.x=cx-(cx-state.x)*ratio;state.y=cy-(cy-state.y)*ratio;state.scale=next;transform()}
function selectOperation(irId,blockId){state.ir=irId||null;state.block=blockId||operationEntries(state.current).find(e=>e.ir.id===irId)?.block_id||null;state.tab="operation";highlight();renderTabs();renderPanel()}
function highlight(){for(const el of $("graph-stage").querySelectorAll("[data-ir-id],[data-block-id]")){const match=state.ir?el.getAttribute("data-ir-id")===state.ir:state.block&&el.getAttribute("data-block-id")===state.block&&!el.hasAttribute("data-ir-id");el.classList.toggle("review-selected",Boolean(match))}}
function renderTabs(){document.querySelectorAll(".tab").forEach(tab=>{const selected=tab.dataset.tab===state.tab;tab.classList.toggle("active",selected);tab.setAttribute("aria-selected",String(selected))})}
function renderPanel(){const p=$("detail-panel");p.replaceChildren();renderTabs();if(!state.current){p.append(notice("没有导出案例。"));return}if(state.tab==="source")renderSource(p);else if(state.tab==="audit")renderAudit(p);else renderOperation(p)}
function renderOperation(p){const c=state.current;const found=operationEntries(c).find(entry=>entry.ir.id===state.ir);if(!found){p.append(node("h2","",state.block?`块 ${state.block}`:"当前样例"));p.append(runReason(c,"feedback","语义核对"),runReason(c,"annotation","安全标注"));p.append(node("p","small","点击图中的操作，查看它的输入输出、四字段标注与原始证据。也可以从下面按实际 IR ID 选择。"));const partial=Object.entries(c.transfer_specs||{}).filter(([,spec])=>spec.order==="partial");if(partial.length){p.append(node("h3","","部分顺序关系"));for(const [id] of partial)p.append(button(`${id} · 按先后约束计算可能顺序`,()=>selectOperation(id),"op"))}for(const [id,b] of Object.entries(c.cfg?.blocks||{})){if(state.block&&state.block!==id)continue;p.append(node("h3","",`${id} · ${b.block_name||""}`));for(const ir of b.instructions||[]){const op=button("",()=>selectOperation(ir.id,id),"op");add(op,node("strong","",`${ir.id} · ${ir.opcode}`),node("span","",(c.profiles?.[ir.id]?.effects||[]).map((value,index)=>`${index+1}. ${value}`).join(" · ")||"没有已记录 effect 标签"));p.append(op)}}if(!c.cfg)p.append(notice("缺少有效 CFG；没有借用旧图或其他案例的标注。","error"));appendSinkBoundaries(p,c,null);appendAssistantReview(p,c);appendBoundaries(p,c);return}const{ir,block_id,block}=found;p.append(node("h2","",`${ir.id} · ${ir.opcode}`),node("div","small",`${block_id} · ${block.block_name||""}`),button("查看本块全部操作",()=>selectOperation(null,block_id),"linkbutton"));const profile=c.profiles?.[ir.id];if(!profile)p.append(notice("这条 IR 没有经过接受的安全标注。完整响应未通过校验时，本页不展示为有效 profile。","warn"));else{if(c.transfer_specs?.[ir.id]?.order==="partial")p.append(notice("部分顺序：以下编号供定位；分析按必要因果关系计算可能次序，不能视为确定执行链。","warn"));for(const key of["operator","roles","effects"]){p.append(node("h3","",key==="operator"?"执行主体（operator）":key));const row=node("div","tagrow");for(const [index,value] of (profile[key]||[]).entries())row.append(node("span","tag",`${key==="effects"?`${index+1}. `:""}${value} · ${effectLabels[value]||""}`));if(!row.childNodes.length)row.append(node("span","small",key==="effects"?"[] · 未记录适用效果；不等于空操作，也不表示入口与出口状态相同。请结合证据与处理关系阅读":"[] · 未记录适用标签；请结合证据与处理关系阅读"));p.append(row)}}p.append(node("h3","","实际输入 / 输出"),jsonBlock({inputs:ir.inputs,outputs:ir.outputs}));const raw=node("details","raw-details");add(raw,node("summary","","操作完整记录（含约束与 metadata）"),jsonBlock(ir));p.append(raw);appendLocationDeclarations(p,c,ir.id);appendSinkBoundaries(p,c,ir.id);if(profile){p.append(node("h3","",`evidences · ${profile.evidences?.length||0} 条`));for(const e of profile.evidences||[]){const card=node("div","evidence");add(card,node("div","evidence-title",`${e.field}${e.effect_index!=null?` · 步骤 ${e.effect_index+1}（索引 ${e.effect_index}）`:""} · ${e.value??"空标签"}`),node("div","small",`${e.basis} · ${typeof e.ref_id==="string"?e.ref_id:JSON.stringify(e.ref_id)}`),node("div","quote",e.quote||"未提供原文引文"),node("div","text small",e.reason||""));const ref=sourceLocation(e,c);if(ref)card.append(button("定位完整源文",()=>openSource(ref.file,ref.start_line,ref.end_line),"linkbutton"));appendEvidenceLocation(card,e,c);p.append(card)}}p.append(notice("effects 按步骤保留顺序与重复项，程序不证明模型推断的时序正确；model_observe 不等于已经计算了模型看到的敏感数据。保护声明也不等于已执行过滤。"))}
function sourceLocation(e,c){if(e.basis!=="source")return null;const location=typeof e.ref_id==="object"?e.ref_id:null;if(location?.file)return location;const units=c.annotation_evidence_index?.source_index||c.source?.units||[];return units.find(u=>u.id===e.ref_id)||null}
function appendLocationDeclarations(p,c,irId){
 const used=new Set();
 function collect(events){for(const event of events||[]){if(event.kind==="for_each")collect(event.body);else for(const op of event.atomic_ops||[])for(const field of ["location","target"])if(op[field])used.add(op[field]);}}collect(c.transfer_specs?.[irId]?.events);
 for(const [id,location] of Object.entries(c.locations||{}))if((location.operand_refs||[]).some(ref=>ref.instruction_id===irId))used.add(id);
 if(!used.size)return;
 p.append(node("h3","","位置声明"));
 for(const id of used){const location=c.locations?.[id];if(!location)continue;const card=node("div","evidence");add(card,node("div","evidence-title",`${id} · ${location.kind} · ${location.name}`),jsonBlock({kind:location.kind,name:location.name,operand_refs:location.operand_refs,access_scope:location.access_scope,retention:location.retention}));p.append(card)}
 const audit=node("details","raw-details location-audit");audit.append(node("summary","","位置证据审计（独立保存）"));
 for(const id of used)for(const e of c.annotation_audit?.evidences?.[id]||[]){const card=node("div","evidence");add(card,node("div","evidence-title",`${id} · ${e.basis} · ${e.ref_id}`),node("div","quote",e.quote),node("div","text small",e.reason));const ref=sourceLocation(e,c);if(ref)card.append(button("定位完整源文",()=>openSource(ref.file,ref.start_line,ref.end_line),"linkbutton"));appendEvidenceLocation(card,e,c);audit.append(card)}
 if(c.annotation_audit)audit.append(node("div","small mono",`审计表摘要：${c.annotation_audit.sha256}`));p.append(audit)
}
function appendSinkBoundaries(p,c,irId){
 const values=(c.sink_boundaries||[]).filter(item=>!irId||item.instruction_id===irId);
 p.append(node("h3","","Sink 边界与固定暴露等级"));
 p.append(node("p","small","等级由程序按访问范围和留存计算，只描述边界性质，不是敏感度、危险程度、任务必要性或 DOE 判断。等级 0 的内部流动继续传播；删除不交付旧内容。"));
 if(!values.length){p.append(node("p","small","当前范围没有纳入 Sink 清单的操作。"));return;}
 for(const item of values){const loc=c.locations?.[item.target];const body=item.body_event_index==null?"":`.${item.body_event_index}`;const card=node("div","evidence");add(card,node("div","evidence-title",`${item.instruction_id} / ${item.event_index}${body} / ${item.op_index} · ${item.sink_type} · 等级 ${item.exposure_level}`),node("div","small",`${item.target} · ${loc?.kind||""} / ${loc?.name||""} · ${loc?.access_scope||""} / ${loc?.retention??"未建模留存"}${item.scope?` · 同一元素作用域 ${item.scope}`:""}`));p.append(card);}
}
function appendAssistantReview(p,c){
 const review=c.assistant_review;p.append(node("h3","","助手复核（独立于模型判断）"));
 if(!review||!["reviewed","execution_only"].includes(review.status)||!review.reviews?.length){p.append(notice("本例尚未完成助手复核；不能将程序状态视为人工确认。"));return}
 p.append(notice(review.human_confirmed?"本记录标记为已由用户确认，请结合确认范围阅读。":"这是助手复核，尚未标记用户人工确认。"));
 if(!c.cfg)p.append(notice("本例没有可用图；仅执行记录复核不能构成图语义复核通过。","warn"));
 else if(!review.reviews.some(entry=>entry.scope!=="execution_only"&&entry.matches_selected_graph))p.append(notice("当前选定图尚未完成助手复核；已有其他轮次或执行记录的复核不能替代。","warn"));
 for(const entry of review.reviews){
  const executionOnly=entry.scope==="execution_only";
  const title=executionOnly?"仅执行记录复核，无可用图":`第 ${entry.revision} 轮 · ${entry.matches_selected_graph?"当前选定图":"历史轮次，不能替代当前图复核"}`;
  const card=node("article","evidence");card.append(node("div","evidence-title",title));
  if(!executionOnly)card.append(node("div","small mono",`图摘要：${entry.graph_sha256||"未记录"}`));
  if(entry.assessment)card.append(node("p","text small",entry.assessment));
  for(const text of entry.observations||[])card.append(node("p","text small",text));p.append(card)
 }
}
function appendEvidenceLocation(card,e,c){const index=c.annotation_evidence_index||{};if(e.basis==="cfg"){const target=(index.graph_index||[]).find(row=>row.id===e.ref_id);if(target){card.append(node("div","small mono",target.pointer));if(target.instruction_id)card.append(button("定位该 IR",()=>selectOperation(target.instruction_id,target.block_id),"linkbutton"));else if(target.block_id)card.append(button("定位该块",()=>selectOperation(null,target.block_id),"linkbutton"))}}else if(e.basis==="execution_model"){const rule=(index.execution_model?.rules||[]).find(row=>row.id===e.ref_id);if(rule)card.append(notice(`${rule.id} · 固定执行假设\n${rule.text}`))}}
function appendBoundaries(p,c){if(c.graph_sha256){const d=node("details","raw-details");add(d,node("summary","","来源与运行绑定"),jsonBlock({graph_sha256:c.graph_sha256,source_sha256:c.source?.source_sha256,source_binding:c.source_binding,validation:c.validation,provenance:c.provenance}));p.append(d)}}
function renderAudit(p){const c=state.current;p.append(node("h2","","完整源文 ↔ 受控语义回述"),badge(c.feedback_status),node("div","small","以下为核对模型的原始判断；助手复核单独列示，不改写模型结论。"));appendAssistantReview(p,c);p.append(runReason(c,"feedback","语义核对"));if(!c.audit){p.append(notice("选定轮次没有有效语义核对记录。此处不显示旧轮判断，也不把没有差异记录当作通过。","warn"));return}const findings=c.audit.findings||[];const problems=findings.filter(f=>f.kind==="semantic"&&f.status!=="represented");p.append(node("div","metadata",`${findings.filter(f=>f.kind==="semantic").length} 个业务项 · ${problems.length} 个差异 · ${findings.filter(f=>f.conservative).length} 个保守依赖说明`));const control=node("label","check-control"),check=document.createElement("input");check.type="checkbox";check.checked=state.showAll;check.addEventListener("change",()=>{state.showAll=check.checked;renderPanel()});add(control,check,node("span","","显示全部核对项（含保留与背景）"));p.append(control);const visible=state.showAll?findings:problems;if(!visible.length)p.append(notice("本轮没有明确差异记录。保留是模型判定；编号覆盖和引文有效不证明语义等价。"));for(const f of visible){const card=node("article","finding");add(card,add(node("div","finding-label"),node("strong","mono",f.id),badge(f.status)),node("div","small",f.kind==="context"?"背景项，不计作业务通过":"业务语义核对"));for(const[label,key]of[["原文要求","source_requirement"],["实际表示","actual_representation"],["比较理由","reason"]])card.append(node("p","",`${label}：${f[key]||""}`));if(f.conservative){card.append(notice(`保守依赖 ${f.conservative.rule_id}：${f.conservative.reason}\n损失的区分：${(f.conservative.lost_distinctions||[]).join("；")}`,"warn"))}for(const ref of f.source_refs||[]){card.append(button(`${ref.file}:${ref.start_line}–${ref.end_line} · ${ref.unit_id}`,()=>openSource(ref.file,ref.start_line,ref.end_line),"linkbutton"),node("div","quote",ref.quote))}for(const s of f.suggestions||[])card.append(notice(`修改建议：${s.change}\n依据：${s.reason}\n目标事实：${(s.target_ids||[]).join(", ")}`));const ev=node("details","raw-details");add(ev,node("summary","","受控事实与程序映射位置"),jsonBlock({controlled_refs:f.controlled_refs,graph_refs:f.graph_refs}));card.append(ev);p.append(card)}p.append(notice("未填写 conservative 的保留项不自动等于精确保留。修改建议尚未自动实施；本页展示的是选定图对应的核对记录。"))}
function openSource(file,start,end){state.tab="source";state.sourceFile=file;state.sourceRange=[start,end??start];renderPanel();requestAnimationFrame(()=>$("detail-panel").querySelector(".source-line.highlight")?.scrollIntoView({block:"center"}))}
function renderSource(p){const files=state.current.source?.files||[];p.append(node("h2","","完整可读源文"),node("div","small","显示冻结源文全文与行号。脚本和 metadata 仅作文字展示，不在页面执行。"));if(!files.length){p.append(notice("没有可读源文。请查看本例输入或执行错误。","warn"));return}if(!files.some(f=>f.path===state.sourceFile))state.sourceFile=files[0].path;const selector=node("select","file-selector");selector.setAttribute("aria-label","选择源文文件");for(const file of files){const option=node("option","",file.path);option.value=file.path;option.selected=file.path===state.sourceFile;selector.append(option)}selector.addEventListener("change",()=>{state.sourceFile=selector.value;state.sourceRange=null;renderPanel()});p.append(selector);const file=files.find(f=>f.path===state.sourceFile);if(file.sha256)p.append(node("div","small mono",`SHA-256 ${file.sha256}`));const content=node("div","source-content");file.content.split(/\r?\n/).forEach((line,index)=>{const number=index+1,highlighted=state.sourceRange&&number>=state.sourceRange[0]&&number<=state.sourceRange[1];const row=node("div","source-line"+(highlighted?" highlight":""));row.dataset.line=String(number);add(row,node("span","line-number",number),node("code","",line||" "));content.append(row)});p.append(content);const units=(state.current.source?.units||[]).filter(u=>u.file===file.path);if(units.length){const d=node("details","raw-details");add(d,node("summary","",`本文件 ${units.length} 个源文定位单元`),jsonBlock(units));p.append(d)}}
$("run-info").textContent=`${DATA.run_id||"本地导出"}\n${DATA.cases.length} 例 · 全部材料内嵌 · 无网络请求`;
for(const id of["search","feedback-filter","annotation-filter"])$(id).addEventListener(id==="search"?"input":"change",renderList);
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{state.tab=tab.dataset.tab;renderPanel()}));
$("fit").addEventListener("click",fit);$("zoom-in").addEventListener("click",()=>zoom(1.25));$("zoom-out").addEventListener("click",()=>zoom(.8));$("actual-size").addEventListener("click",()=>zoom(1/state.scale));
$("viewport").addEventListener("wheel",event=>{event.preventDefault();const r=$("viewport").getBoundingClientRect();zoom(Math.exp(-event.deltaY*.0015),event.clientX-r.left,event.clientY-r.top)},{passive:false});
let drag=null;
$("viewport").addEventListener("pointerdown",event=>{if(event.button!==0)return;drag={x:event.clientX,y:event.clientY,startX:state.x,startY:state.y,moved:false,target:event.target};$("viewport").setPointerCapture(event.pointerId);$("viewport").classList.add("dragging")});
$("viewport").addEventListener("pointermove",event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){state.x=drag.startX+dx;state.y=drag.startY+dy;transform()}});
$("viewport").addEventListener("pointerup",()=>{if(!drag)return;if(!drag.moved){const target=drag.target.closest?.("[data-ir-id],[data-block-id]");if(target)selectOperation(target.getAttribute("data-ir-id"),target.getAttribute("data-block-id"))}drag=null;$("viewport").classList.remove("dragging")});
$("viewport").addEventListener("pointercancel",()=>{drag=null;$("viewport").classList.remove("dragging")});
window.addEventListener("resize",fit);
if(DATA.cases.length)selectCase(DATA.cases[0].case_id);else{renderList();renderPanel();$("graph-empty").hidden=false;$("graph-empty").textContent="此导出没有案例。"}
</script>
</body>
