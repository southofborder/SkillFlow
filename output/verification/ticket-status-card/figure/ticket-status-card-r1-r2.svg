<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="990" viewBox="0 0 1760 990" role="img"><title>Ticket status card — Annotated CFG with Task Requirements</title><desc>Offline analysis of the same ticket workflow under two requirements. The board receives the original ticket. Displaying ID and status and publishing once require only two fields.</desc><metadata>{"basis": "Controlled task variant retaining R1 and R2", "parent_selection": {"task": {"path": "task/task.json", "sha256": "3cc31dd2472ec4458ee21d76d7ce581f468d3587b4f6e8e413cf0fec3d603039"}, "cfg": {"path": "graph/initial.json", "sha256": "ab2e62fb7f18cfc46680e35a658114fef33287573cefdfb65eb30c3948b6faf8"}, "annotation": {"path": "annotation/manifest.json", "sha256": "a96a2333b9a66cdd46d7c22b55cac07fc8ad4e2ebe394e2949a496fe23ce5c8d"}}, "doe_sha256": "a18dda55f2c0f60bcd8799017ca98434561adb5b49e6fe7c367cd3ba2cfc6b27"}</metadata><rect x="0" y="0" width="1760" height="990" rx="0" fill="#F7F9F9" stroke="none" stroke-width="1.5" /><text x="56" y="73" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="50">Ticket status card</text><text x="58" y="109" fill="#415A69" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="26">Annotated CFG  /  R1 and R2 only  /  Offline comparison</text><polyline points="998,83 1038,83" fill="none" stroke="#244D67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="1038.00,83.00 1028.00,78.00 1028.00,88.00" fill="#244D67" /><text x="1051" y="90" fill="#244D67" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20">Control flow</text><polyline points="1224,83 1264,83" fill="none" stroke="#116559" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="1264.00,83.00 1254.00,78.00 1254.00,88.00" fill="#116559" /><text x="1277" y="90" fill="#116559" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20">Data flow</text><polyline points="1433,83 1473,83" fill="none" stroke="#694782" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" /><polygon points="1473.00,83.00 1463.00,78.00 1463.00,88.00" fill="#694782" /><text x="1486" y="90" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20">Backward demand</text><rect x="56" y="143" width="852" height="255" rx="12" fill="#FFFFFF" stroke="#BCCBD2" stroke-width="1.5" /><rect x="75" y="157" width="120" height="30" rx="5" fill="#E7EFF4" stroke="none" stroke-width="1.5" /><text x="85" y="179" fill="#244D67" font-family="Consolas, monospace" font-weight="400" font-size="19">block_001</text><text x="208" y="180" fill="#244D67" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="26">Entry</text><polyline points="77,194 885,194" fill="none" stroke="#D8E2E6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="82" y="224" fill="#244D67" font-family="Consolas, monospace" font-weight="400" font-size="21">ir_001</text><text x="195" y="224" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="26">receive</text><text x="82" y="257" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">in[0] = context.ticket</text><text x="440" y="257" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">out[0] = result_001</text><text x="82" y="288" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">e0   Read ticket into incoming_ticket and bind it to out[0].</text><text x="82" y="318" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">e1   Model observes the acquired ticket under the default contract.</text><text x="82" y="345" fill="#974721" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">Sensitive at input and at read</text><text x="371" y="345" fill="#974721" font-family="Consolas, monospace" font-weight="400" font-size="19">requester_email  /  private_contact_address</text><polyline points="77,357 885,357" fill="none" stroke="#D8E2E6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="82" y="385" fill="#244D67" font-family="Consolas, monospace" font-weight="400" font-size="21">ir_002</text><text x="195" y="385" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="26">dispatch</text><text x="350" y="384" fill="#415A69" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="21">Unconditional jump to block_002.</text><polyline points="138,398 138,461" fill="none" stroke="#244D67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="138.00,461.00 143.00,451.00 133.00,451.00" fill="#244D67" /><text x="162" y="439" fill="#244D67" font-family="Consolas, monospace" font-weight="400" font-size="21">block_001 → block_002</text><rect x="56" y="465" width="852" height="319" rx="12" fill="#FFFFFF" stroke="#BCCBD2" stroke-width="1.5" /><rect x="75" y="478" width="120" height="30" rx="5" fill="#E7EFF4" stroke="none" stroke-width="1.5" /><text x="85" y="500" fill="#244D67" font-family="Consolas, monospace" font-weight="400" font-size="19">block_002</text><text x="208" y="501" fill="#244D67" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="26">Publish</text><polyline points="77,515 885,515" fill="none" stroke="#D8E2E6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="82" y="545" fill="#244D67" font-family="Consolas, monospace" font-weight="400" font-size="21">ir_003</text><text x="195" y="545" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="26">call</text><rect x="791" y="524" width="42" height="25" rx="5" fill="#F0EAF5" stroke="none" stroke-width="1.5" /><text x="800" y="542" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="16">R1</text><rect x="837" y="524" width="42" height="25" rx="5" fill="#F0EAF5" stroke="none" stroke-width="1.5" /><text x="846" y="542" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="16">R2</text><text x="82" y="578" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="20">in[0] = status_board.publish</text><text x="440" y="578" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="20">in[1] = result_001</text><text x="82" y="609" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">e0   Deliver card = result_001 to the shared board.</text><text x="82" y="640" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">e1   Receive publish_completion for this same invocation.</text><text x="82" y="671" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">e2   Model observes the opaque completion under the default contract.</text><text x="82" y="710" fill="#415A69" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="21">The tool declares no return content. The call defines no IR output.</text><polyline points="77,734 885,734" fill="none" stroke="#D8E2E6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="82" y="766" fill="#244D67" font-family="Consolas, monospace" font-weight="400" font-size="21">ir_004</text><text x="195" y="766" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="26">return</text><text x="350" y="765" fill="#415A69" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="21">End the Skill with no return value.</text><polyline points="908,257 945,257 945,572 910,572" fill="none" stroke="#116559" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="910.00,572.00 920.00,577.00 920.00,567.00" fill="#116559" /><polyline points="908,607 985,607 985,225 910,225" fill="none" stroke="#694782" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" /><polygon points="910.00,225.00 920.00,230.00 920.00,220.00" fill="#694782" /><rect x="1036" y="143" width="668" height="641" rx="12" fill="#FFFFFF" stroke="#BCCBD2" stroke-width="1.5" /><text x="1060" y="186" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="29">Task Requirements and IR bindings</text><polyline points="1060,206 1680,206" fill="none" stroke="#D8E2E6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="1062" y="225" width="42" height="25" rx="5" fill="#F0EAF5" stroke="none" stroke-width="1.5" /><text x="1071" y="243" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="16">R1</text><text x="1119" y="246" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="23">Show the ticket ID and status to board members.</text><text x="1062" y="288" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">Bind</text><text x="1162" y="288" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">ir_003.in[1]</text><text x="1062" y="323" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">Seed</text><text x="1162" y="323" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">deliver.arg[0].ticket_id</text><text x="1162" y="350" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">deliver.arg[0].status</text><polyline points="1060,376 1680,376" fill="none" stroke="#D8E2E6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="1062" y="395" width="42" height="25" rx="5" fill="#F0EAF5" stroke="none" stroke-width="1.5" /><text x="1071" y="413" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="16">R2</text><text x="1119" y="416" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="23">Publish the card exactly once.</text><text x="1062" y="458" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">Bind</text><text x="1162" y="458" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">ir_003</text><text x="1062" y="493" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">Seed</text><text x="1162" y="493" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">Preserve the deliver action.</text><text x="1062" y="528" fill="#694782" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">Limit</text><text x="1162" y="528" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">At most one delivery attempt per task.</text><polyline points="1060,552 1680,552" fill="none" stroke="#D8E2E6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="1062" y="592" fill="#244D67" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="25">Fields at the publish operation</text><text x="1062" y="637" fill="#116559" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20">Interface requires</text><text x="1265" y="637" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="22">ticket_id, status</text><text x="1062" y="680" fill="#974721" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20">Also delivered</text><text x="1265" y="680" fill="#974721" font-family="Consolas, monospace" font-weight="400" font-size="22">requester_email</text><text x="1062" y="733" fill="#415A69" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">The board shows every supplied field to its members.</text><rect x="56" y="805" width="1648" height="138" rx="12" fill="#EDF5F2" stroke="#B5CCC4" stroke-width="1.5" /><text x="82" y="840" fill="#116559" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="25">At the board boundary</text><text x="82" y="877" fill="#116559" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20">Delivered</text><text x="211" y="877" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">ticket_id, status, requester_email</text><text x="82" y="914" fill="#116559" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20">Required</text><text x="211" y="914" fill="#152D3D" font-family="Consolas, monospace" font-weight="400" font-size="21">ticket_id, status</text><polyline points="931,826 931,924" fill="none" stroke="#B5CCC4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="962" y="842" fill="#116559" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="24">DOE on requester_email</text><text x="962" y="878" fill="#974721" font-family="Consolas, monospace" font-weight="400" font-size="24">excess_supported</text><text x="962" y="912" fill="#152D3D" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="22">Omit requester_email from the card at ir_003.</text><text x="57" y="974" fill="#415A69" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="19">e0–e2 are local event indices within an instruction. At ir_003, IR input 1 supplies delivery argument 0.</text></svg>