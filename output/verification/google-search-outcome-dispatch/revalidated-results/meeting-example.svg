text></a><a href="annotations.html#ir-ir_076" aria-label="Open evidence for ir_076"><rect x="766" y="197" width="274" height="112" rx="13" fill="#ffffff" stroke="#c3d6d1" stroke-width="2" /><text x="784" y="223" fill="#0c695d" font-size="17" font-weight="700">ir_076  ·  HTTP call</text><text x="784" y="262" fill="#132b3b" font-size="24" font-weight="700">Public GET</text><text x="784" y="291" fill="#415767" font-size="18" font-weight="400">params.key carries this key</text></a><a href="annotations.html#ir-ir_034" aria-label="Open evidence for ir_034"><rect x="52" y="385" width="308" height="112" rx="13" fill="#ffffff" stroke="#c3d6d1" stroke-width="2" /><text x="70" y="411" fill="#0c695d" font-size="17" font-weight="700">ir_034  ·  CLI entry</text><text x="70" y="450" fill="#132b3b" font-size="24" font-weight="700">GOOGLE_API_KEY</text><text x="70" y="479" fill="#415767" font-size="18" font-weight="400">Data ID data_8c17fe1b…</text></a><a href="annotations.html#ir-ir_045" aria-label="Open evidence for ir_045"><rect x="413" y="385" width="303" height="112" rx="13" fill="#ffffff" stroke="#c3d6d1" stroke-width="2" /><text x="431" y="411" fill="#0c695d" font-size="17" font-weight="700">ir_045 → ir_047  ·  CLI</text><text x="431" y="450" fill="#132b3b" font-size="24" font-weight="700">Bind CLI arguments</text><text x="431" y="479" fill="#415767" font-size="18" font-weight="400">Readmitted transfer → params</text></a><a href="annotations.html#ir-ir_049" aria-label="Open evidence for ir_049"><rect x="766" y="385" width="274" height="112" rx="13" fill="#ffffff" stroke="#c3d6d1" stroke-width="2" /><text x="784" y="411" fill="#0c695d" font-size="17" font-weight="700">ir_049  ·  HTTP call</text><text x="784" y="450" fill="#132b3b" font-size="24" font-weight="700">CLI GET</text><text x="784" y="479" fill="#415767" font-size="18" font-weight="400">params.key carries this key</text></a><text x="231" y="362" fill="#654397" font-size="18" font-weight="700">R9 reaches the public argument</text><text x="231" y="550" fill="#654397" font-size="18" font-weight="700">R9 reaches the environment read</text><g><rect x="1118" y="197" width="430" height="300" rx="18" fill="#e8f4ee" stroke="#87b7a2" stroke-width="2" /><text x="1140" y="233" fill="#0c695d" font-size="20" font-weight="700">Remote receiver</text><text x="1140" y="279" fill="#132b3b" font-size="30" font-weight="700">Google Custom Search</text><text x="1140" y="320" fill="#132b3b" font-size="23" font-weight="400">https://www.googleapis.com</text><text x="1140" y="349" fill="#132b3b" font-size="23" font-weight="400">/customsearch/v1</text><text x="1140" y="393" fill="#132b3b" font-size="21" font-weight="700">Query fields: q, key, cx, num</text><text x="1140" y="435" fill="#415767" font-size="20" font-weight="400">Both GETs record delivery on normal</text><text x="1140" y="463" fill="#415767" font-size="20" font-weight="400">return and post-send failure.</text></g><path d="M964 500 V581 H607 V613" fill="none" stroke="#92511a" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#exception-arrow)" /><text x="998" y="559" fill="#92511a" font-size="18" font-weight="700">Throw before or after delivery</text><text x="54" y="651" fill="#132b3b" font-size="27" font-weight="700">CLI exception path</text><text x="54" y="687" fill="#415767" font-size="20" font-weight="400">R12 calls for printing the error</text><text x="54" y="716" fill="#415767" font-size="20" font-weight="400">and exiting with status 1.</text><a href="annotations.html#ir-ir_060" aria-label="Open evidence for ir_060"><rect x="413" y="618" width="323" height="118" rx="13" fill="#fffaf1" stroke="#d8b083" stroke-width="2" /><text x="431" y="646" fill="#92511a" font-size="17" font-weight="700">ir_060 → ir_061  ·  processed</text><text x="431" y="685" fill="#132b3b" font-size="24" font-weight="700">Match the exception</text><text x="431" y="716" fill="#415767" font-size="19" font-weight="400">except Exception</text></a><path d="M739 678 H793" fill="none" stroke="#92511a" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#exception-arrow)" stroke-dasharray="9 7" /><a href="annotations.html#ir-ir_063" aria-label="Open evidence for ir_063"><rect x="798" y="618" width="388" height="118" rx="13" fill="#fff3e3" stroke="#cc9a64" stroke-width="2" /><text x="816" y="646" fill="#92511a" font-size="17" font-weight="700">ir_063  ·  unmodeled</text><text x="816" y="685" fill="#132b3b" font-size="24" font-weight="700">Format and print the error</text><text x="816" y="716" fill="#92511a" font-size="20" font-weight="700">0 recorded stdout deliveries</text></a><path d="M1189 678 H1246" fill="none" stroke="#92511a" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#exception-arrow)" stroke-dasharray="9 7" /><a href="annotations.html#ir-ir_065" aria-label="Open evidence for ir_065"><rect x="1251" y="618" width="297" height="118" rx="13" fill="#faf6ef" stroke="#d8c6aa" stroke-width="2" /><text x="1269" y="646" fill="#92511a" font-size="17" font-weight="700">ir_065  ·  blocked</text><text x="1269" y="685" fill="#132b3b" font-size="23" font-weight="700">Exit with status 1</text><text x="1269" y="716" fill="#415767" font-size="19" font-weight="400">Source continuation</text></a><rect x="52" y="772" width="1496" height="99" rx="14" fill="#f0edf7" /><text x="75" y="811" fill="#654397" font-size="24" font-weight="700">R9 binds each GET action and its whole request.</text><text x="75" y="848" fill="#132b3b" font-size="21" font-weight="400">Neither GET has a field-specific R9 demand for params.key.</text><text x="1020" y="812" fill="#415767" font-size="20" font-weight="700">Forward incomplete</text><text x="1020" y="845" fill="#415767" font-size="20" font-weight="400">Backward partial  ·  DOE partial</text></svg>