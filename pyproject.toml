[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillflow"
version = "0.1.0"
description = "SkillFlow graph construction and static data propagation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "tomli>=2.0; python_version<'3.11'"]

[project.optional-dependencies]
test = ["pytest>=9", "markdown-it-py>=4", "tiktoken==0.12.0"]

[project.scripts]
skillflow = "skillflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "skillflow._lean_sources" = "formal"}

[tool.setuptools.package-data]
"skillflow._lean_sources" = ["*.lean", "SkillIR/*.lean", "lean-toolchain", "lakefile.toml", "lake-manifest.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
