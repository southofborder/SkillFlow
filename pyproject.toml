[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillflow"
version = "0.1.0"
description = "SkillFlow graph construction and static data propagation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "tomli>=2.0; python_version<'3.11'"]

[project.scripts]
skillflow = "skillflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillflow*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
