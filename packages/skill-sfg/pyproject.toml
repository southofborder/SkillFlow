[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-sfg"
version = "2.0.0-py"
description = "SkillFlow SFG analyzer (Skill Flow Graph) — judgment-driven Python engine (produces DOE over-exposure digests)"
requires-python = ">=3.11"
# The LLM transport is hand-rolled on urllib (faithful port of shared/
# llm-utils.cjs), so no HTTP dep. PyYAML mirrors gray-matter's js-yaml
# front-matter parse (SKILL.md YAML front matter → name/description/version).
# httpx is an optional upgrade for HTTP/2 (see llm/transport.py notes).
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
skill-sfg = "skill_sfg.cli:main"
skill-sfg-batch = "skill_sfg.batch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_sfg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
