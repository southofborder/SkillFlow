[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-fcg"
version = "2.0.0-py"
description = "SkillFlow FCG analyzer — judgment-driven Python rewrite (produces DOE necessity-judgment digests)"
requires-python = ">=3.11"
# The LLM transport is hand-rolled on urllib (faithful port of shared/
# llm-utils.cjs), so no HTTP dep. PyYAML mirrors gray-matter's js-yaml
# front-matter parse (SKILL.md YAML front matter → name/description/version).
# httpx is an optional upgrade for HTTP/2 (see llm/transport.py notes).
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
skill-fcg = "skill_fcg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_fcg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
