<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="350" viewBox="0 0 1360 350" role="img" aria-labelledby="title description">
  <title id="title">SkillFlow system overview</title>
  <desc id="description">The front end models Skill behavior and extracts task requirements independently. Its output is an Annotated CFG with Task Requirements. The CFG retains operation semantics and sensitive sources, and task requirements are bound to Skill-IR. Forward propagation uses the CFG and operation semantics. Backward demand analysis uses the bound task requirements, the annotated CFG, and versioned data bindings from forward propagation. Boundary comparisons and a task-preservation check support reduction advice.</desc>
