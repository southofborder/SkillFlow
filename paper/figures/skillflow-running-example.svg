<svg xmlns="http://www.w3.org/2000/svg" width="720" height="442" viewBox="0 0 720 442" role="img" aria-labelledby="title description">
  <title id="title">One key, two data boundaries</title>
  <desc id="description">In google-search, the API key is required in the request to Google. On an HTTP 4xx or 5xx response, if the response URL still contains the key, Requests includes it in the exception and the script prints it. The error can be reported without the key.</desc>
  <rect width="720" height="442" fill="#FFFFFF"/>

  <g font-family="Arial, sans-serif" fill="#162940">
    <text x="22" y="39" font-size="32" font-weight="700">One key, two data boundaries</text>
    <text x="698" y="38" text-anchor="end" font-family="Consolas, monospace" font-size="22" fill="#526781">google-search</text>

    <rect x="22" y="62" width="242" height="96" rx="8" fill="#F1F5FB" stroke="#98ACC8" stroke-width="1.6"/>
    <text x="39" y="96" font-size="22" font-weight="700" fill="#345C9C">Credential source</text>
    <text x="39" y="132" font-family="Consolas, monospace" font-size="23" font-weight="700">GOOGLE_API_KEY</text>

    <rect x="318" y="62" width="380" height="96" rx="8" fill="#E5F3EF" stroke="#7EB6A8" stroke-width="1.6"/>
    <text x="337" y="92" font-size="23" font-weight="700" fill="#156658">01  Google API request</text>
    <text x="337" y="119" font-size="22"><tspan font-family="Consolas, monospace" font-weight="700">key</tspan><tspan> query parameter</tspan></text>
    <text x="337" y="145" font-size="20" font-weight="700" fill="#156658">Required to identify the application</text>

    <path d="M 265,109 H 306" fill="none" stroke="#156658" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 318,109 l -13,-6 v 12 z" fill="#156658"/>

    <path d="M 530,159 V 194 H 143 V 233" fill="none" stroke="#526781" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 143,244 l -6,-12 h 12 z" fill="#526781"/>
    <text x="159" y="185" font-size="21" font-weight="700">If Google returns HTTP 4xx/5xx</text>
    <text x="159" y="219" font-size="21" fill="#42576F">and the response URL still contains <tspan font-family="Consolas, monospace" font-weight="700">key</tspan></text>

    <rect x="22" y="244" width="242" height="115" rx="8" fill="#F1F5FB" stroke="#98ACC8" stroke-width="1.6"/>
    <text x="39" y="274" font-size="23" font-weight="700" fill="#345C9C">HTTPError</text>
    <text x="39" y="305" font-size="21">Status, reason, URL</text>
    <text x="39" y="337" font-size="21">URL includes <tspan font-family="Consolas, monospace" font-weight="700">key</tspan></text>

    <rect x="318" y="244" width="380" height="115" rx="8" fill="#FCF0E7" stroke="#C58A67" stroke-width="1.6"/>
    <text x="337" y="274" font-size="23" font-weight="700" fill="#873E22">02  Error output (stdout)</text>
    <text x="337" y="305" font-size="22"><tspan font-weight="700">Actual:</tspan><tspan> status, reason, URL</tspan></text>
    <rect x="619" y="284" width="60" height="29" rx="5" fill="#F4D9C9"/>
    <text x="649" y="305" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#873E22">key</text>
    <text x="337" y="337" font-size="22"><tspan font-weight="700">Needed:</tspan><tspan> status and reason</tspan></text>

    <path d="M 265,300 H 306" fill="none" stroke="#526781" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 318,300 l -13,-6 v 12 z" fill="#526781"/>

    <rect x="22" y="377" width="676" height="58" rx="6" fill="#F2F5F9"/>
    <rect x="22" y="377" width="5" height="58" rx="2" fill="#345C9C"/>
    <text x="39" y="402" font-size="22" font-weight="700">Redact <tspan font-family="Consolas, monospace">key</tspan> before printing.</text>
    <text x="39" y="425" font-size="20" fill="#42576F">Keep the Google request and failure exit code unchanged.</text>
  </g>
</svg>
