<script>

function renderList(){const q=$("search").value.trim().toLowerCase(),f=$("feedback-filter").value,a=$("annotation-filter").value;const cases=DATA.cases.filter(c=>(!q||[c.case_id,c.sample_id,c.skill_name,c.basename].join(" ").toLowerCase().includes(q))&&(f==="all"||feedbackCategory(c.feedback_status)===f)&&(a==="all"||(a==="failed"?!["complete","incomplete"].includes(c.annotation_status):c.annotation_status===a)));$("case-count").textContent=`显示 ${cases.length} / ${DATA.cases.length} 例`;$ ("case-list").replaceChildren();for(const c of cases){const b=button("",()=>selectCase(c.case_id),"case"+(state.current?.case_id===c.case_id?" active":""));b.setAttribute("aria-label",`${c.case_id} ${c.skill_name||c.basename}`);add(b,add(node("div","case-title"),node("span","case-id",c.case_id),node("span","",c.skill_name||c.basename)),node("div","case-small",`${c.sample_id||""} · 第 ${c.selected_revision??"—"} 轮`),add(node("div","badges"),badge(c.feedback_status),badge(c.annotation_status)));$("case-list").append(b)}if(!cases.length)$("case-list").append(node("div","empty","没有符合筛选条件的样例。"))}

function selectOperation(irId,blockId){state.ir=irId||null;state.block=blockId||operationEntries(state.current).find(e=>e.ir.id===irId)?.block_id||null;state.tab="operation";highlight();renderTabs();renderPanel()}

function renderOperation(p){const c=state.current;const found=operationEntries(c).find(entry=>entry.ir.id===state.ir);if(!found){p.append(node("h2","",state.block?`块 ${state.block}`:"当前样例"));if(c.feedback_reason)p.append(notice("语义核对："+c.feedback_reason,statusClass(c.feedback_status)));if(c.annotation_reason)p.append(notice("安全标注："+c.annotation_reason,statusClass(c.annotation_status)));p.append(node("p","small","点击图中的操作，查看它的输入输出、四字段标注与原始证据。也可以从下面按实际 IR ID 选择。"));if(c.unresolved?.length){p.append(node("h3","","标注未决"));for(const u of c.unresolved)p.append(button(`${u.instruction_id||"?"} · ${u.field||""}：${u.reason}`,()=>selectOperation(u.instruction_id),"op"))}for(const [id,b] of Object.entries(c.cfg?.blocks||{})){if(state.block&&state.block!==id)continue;p.append(node("h3","",`${id} · ${b.block_name||""}`));for(const ir of b.instructions||[]){const op=button("",()=>selectOperation(ir.id,id),"op");add(op,node("strong","",`${ir.id} · ${ir.opcode}`),node("span","",(c.profiles?.[ir.id]?.effects||[]).join(" · ")||"没有已记录 effect 标签"));p.append(op)}}if(!c.cfg)p.append(notice("缺少有效 CFG；没有借用旧图或其他案例的标注。","error"));appendAssistantReview(p,c);appendBoundaries(p,c);return}const{ir,block_id,block}=found;p.append(node("h2","",`${ir.id} · ${ir.opcode}`),node("div","small",`${block_id} · ${block.block_name||""}`),button("查看本块全部操作",()=>selectOperation(null,block_id),"linkbutton"));const profile=c.profiles?.[ir.id];if(!profile)p.append(notice("这条 IR 没有经过接受的安全标注。完整响应未通过校验时，本页不展示为有效 profile。","warn"));else{for(const key of["actor","roles","effects"]){p.append(node("h3","",key));const row=node("div","tagrow");for(const value of profile[key]||[])row.append(node("span","tag",`${value} · ${effectLabels[value]||""}`));if(!row.childNodes.length)row.append(node("span","small","[] · 未记录适用标签；请结合证据与未决项阅读"));p.append(row)}}for(const u of c.unresolved||[])if(u.instruction_id===ir.id)p.append(notice(`${u.field} 未决：${u.reason}`,"warn"));p.append(node("h3","","实际输入 / 输出"),jsonBlock({inputs:ir.inputs,ou function sourceLocation(e,c){if(e.basis!=="source")return null;const location=typeof e.location==="object"?e.location:null;if(location?.file)return location;const units=c.annotation_evidence_index?.source_index||c.source?.units||[];return units.find(u=>u.id===e.location)||null}
function appendAssistantReview(p,c){const review=c.assistant_review;p.append(node("h3","","助手复核（独立于模型判断）"));if(!review||review.status!=="reviewed"||!review.reviews?.length){p.append(notice("本例尚未完成助手复核；不能将程序状态视为人工确认。"));return}p.append(notice(review.human_confirmed?"本记录标记为已由用户确认，请结合确认范围阅读。":"这是助手复核，尚未标记用户人工确认。"));if(!review.reviews.some(entry=>entry.matches_selected_graph))p.append(notice("已有复核对应较早轮次；当前选定图尚未完成助手复核。","warn"));for(const entry of review.reviews){const card=node("article","evidence");add(card,node("div","evidence-title",`第 ${entry.revision} 轮 · ${entry.matches_selected_graph?"当前选定图":"历史轮次，不能替代当前图复核"}`),node("div","small mono",`图摘要：${entry.graph_sha256||"未记录"}`));if(entry.assessment)card.append(node("p","text small",entry.assessment));for(const text of entry.observations||[])card.append(node("p","text small",text));p.append(card)}}

function renderAudit(p){const c=state.current;p.append(node("h2","","完整源文 ↔ 受控语义回述"),badge(c.feedback_status),node("div","small","以下为核对模型的原始判断；助手复核单独列示，不改写模型结论。"));appendAssistantReview(p,c);if(c.feedback_reason)p.append(notice(c.feedback_reason,statusClass(c.feedback_status)));if(!c.audit){p.append(notice("选定轮次没有有效语义核对记录。此处不显示旧轮判断，也不把没有差异记录当作通过。","warn"));return}const findings=c.audit.findings||[];const problems=findings.filter(f=>f.kind==="semantic"&&f.status!=="represented");p.append(node("div","metadata",`${findings.filter(f=>f.kind==="semantic").length} 个业务项 · ${problems.length} 个差异 / 未决 · ${findings.filter(f=>f.conservative).length} 个保守依赖说明`));const control=node("label","check-control"),check=document.createElement("input");check.type="checkbox";check.checked=state.showAll;check.addEventListener("change",()=>{state.showAll=check.checked;renderPanel()});add(control,check,node("span","","显示全部核对项（含保留与背景）"));p.append(control);const visible=state.showAll?findings:problems;if(!visible.length)p.append(notice("本轮没有明确差异或未决记录。保留是模型判定；编号覆盖和引文有效不证明语义等价。"));for(const f of visible){const card=node("article","finding");add(card,add(node("div","finding-label"),node("strong","mono",f.id),badge(f.status)),node("div","small",f.kind==="context"?"背景项，不计作业务通过":"业务语义核对"));for(const[label,key]of[["原文要求","source_requirement"],["实际表示","actual_representation"],["比较理由","reason"]])card.append(node("p","",`${label}：${f[key]||""}`));if(f.unknown_reason)card.append(notice(f.unknown_reason,"warn"));if(f.conservative){card.append(notice(`保守依赖 ${f.conservative.rule_id}：${f.conservative.reason}\n损失的区分：${(f.conservative.lost_distinctions||[]).join("；")}`,"warn"))}for(const ref of f.source_refs||[]){card.append(button(`${ref.file}:${ref.start_line}–${ref.end_line} · ${ref.unit_id}`,()=>openSource(ref.file,ref.start_line,ref.end_line),"linkbutton"),node("div","quote",ref.quote))}for(const s of f.suggestions||[])card.append(notice(`修改建议：${s.change}\n依据：${s.reason}\n目标事实：${(s.target_ids||[]).join(", function openSource(file,start,end){state.tab="source";state.sourceFile=file;state.sourceRange=[start,end??start];renderPanel();requestAnimationFrame(()=>$("detail-panel").querySelector(".source-line.highlight")?.scrollIntoView({block:"center"}))}
function renderSource(p){const files=state.current.source?.files||[];p.append(node("h2","","完整可读源文"),node("div","small","显示冻结源文全文与行号。脚本和 metadata 仅作文字展示，不在页面执行。"));if(!files.length){p.append(notice("没有可读源文。请查看本例输入或执行错误。","warn"));return}if(!files.some(f=>f.path===state.sourceFile))state.sourceFile=files[0].path;const selector=node("select","file-selector");selector.setAttribute("aria-label","选择源文文件");for(const file of files){const option=node("option","",file.path);option.value=file.path;option.selected=file.path===state.sourceFile;selector.append(option)}selector.addEventListener("change",()=>{state.sourceFile=selector.value;state.sourceRange=null;renderPanel()});p.append(selector);const file=files.find(f=>f.path===state.sourceFile);if(file.sha256)p.append(node("div","small mono",`SHA-256 ${file.sha256}`));const content=node("div","source-content");file.content.split(/\r?\n/).forEach((line,index)=>{const number=index+1,highlighted=state.sourceRange&&number>=state.sourceRange[0]&&number<=state.sourceRange[1];const row=node("div","source-line"+(highlighted?" highlight":""));row.dataset.line=String(number);add(row,node("span","line-number",number),node("code","",line||" "));content.append(row)});p.append(content);const units=(state.current.source?.units||[]).filter(u=>u.file===file.path);if(units.length){const d=node("details","raw-details");add(d,node("summary","",`本文件 ${units.length} 个源文定位单元`),jsonBlock(units));p.append(d)}}
$("run-info").textContent=`${DATA.run_id||"本地导出"}\n${DATA.cases.length} 例 · 全部材料内嵌 · 无网络请求`;
for(const id of["search","feedback-filter","annotation-filter"])$(id).addEventListener(id==="search"?"input":"change",renderList);
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{state.tab=tab.dataset.tab;renderPanel()}));
$("fit").addEventListener("click",fit);$("zoom-in").addEventListener("click",()=>zoom(1.25));$("zoom-out").addEventListener("click",()=>zoom(.8));$("actual-size").addEventListener("click",()=>zoom(1/state.scale));
$("viewport").addEventListener("wheel",event=>{event.preventDefault();const r=$("viewport").getBoundingClientRect();zoom(Math.exp(-event.deltaY*.0015),event.clientX-r.left,event.clientY-r.top)},{passive:false});
let drag=null;
$("viewport").addEventListener("pointerdown",event=>{if(event.button!==0)return;drag={x:event.clientX,y:event.clientY,startX:state.x,startY:state.y,moved:false,target:event.target};$("viewport").setPointerCapture(event.pointerId);$("viewport").classList.add("dragging")});
$("viewport").addEventListener("pointermove",event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){state.x=drag.startX+dx;state.y=drag.startY+dy;transform()}});
$("viewport").addEventListener("pointerup",()=>{if(!drag)return;if(!drag.moved){const target=drag.target.closest?.("[data-ir-id],[data-block-id]");if(target)selectOperation(target.getAttribute("data-ir-id"),target.getAttribute("data-block-id"))}drag=null;$("viewport").classList.remove("dragging")});
$("viewport").addEventListener("pointercancel",()=>{drag=null;$("viewport").classList.remove("dragging")});
window.addEventListener("resize",fit);
if(DATA.cases.length)selectCase(DATA.cases[0].case_id);else{renderList();renderPanel();$("graph-empty").hidden=false;$("graph-empty").textContent="此导出没有案例。"}
</script>
</body>
</html>
