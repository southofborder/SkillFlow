[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-ir"
version = "0.1.0"
description = "Independent Skill package to IR/CFG analyzer for SkillFlow"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.scripts]
skill-ir = "skill_ir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skill_ir*"]
